name: Trae 每日签到（账号 A）
on:
  schedule:
    # 账号 A：北京时间 01:07 起每 4 小时一次（UTC 1,5,9,13,17,21 点 :07）。
    - cron: '7 1,5,9,13,17,21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trae-checkin
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 执行签到
        env:
          TRAE_CREDENTIALS: ${{ secrets.TRAE_CREDENTIALS }}
        run: node checkin.js
