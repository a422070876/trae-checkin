name: Trae 每日签到（账号 B）
on:
  schedule:
    # 账号 B：在账号 A 之后 30 分钟（UTC 1,5,9,13,17,21 点 :37）。
    - cron: '37 1,5,9,13,17,21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trae-checkin-2
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 执行签到
        env:
          TRAE_CREDENTIALS: ${{ secrets.TRAE_CREDENTIALS_2 }}
        run: node checkin.js
